<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#026fc7" />
            <stop offset="100%" stop-color="#074b84" />
        </linearGradient>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fde047" />
            <stop offset="100%" stop-color="#f59e0b" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000" flood-opacity="0.25"/>
        </filter>
    </defs>
    
    <!-- Squircle / Rounded Background -->
    <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
    
    <!-- Subtle Inner Border Highlight -->
    <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none" />

    <!-- Golden Achievement Star -->
    <path d="M32 9L35.4 16.5L43.5 17.6L37.7 23.2L39.1 31.2L32 27.4L24.9 31.2L26.3 23.2L20.5 17.6L28.6 16.5Z" 
          fill="url(#goldGrad)" 
          filter="url(#glow)" />

    <!-- Open Book of Knowledge -->
    <path d="M32 37.5C28.2 35 22.5 34.5 14 36V51C22.5 49.5 28.2 50 32 53C35.8 50 41.5 49.5 50 51V36C41.5 34.5 35.8 35 32 37.5Z" 
          fill="#FFFFFF" 
          filter="url(#glow)" />
    <path d="M32 37.5V53" 
          stroke="#074b84" 
          stroke-width="2.5" 
          stroke-linecap="round" />
</svg>
